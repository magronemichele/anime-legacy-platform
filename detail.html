<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Anime Legacy Details - In-depth analysis of anime stories, worlds, and archetypes."
    />
    <title>Details | Anime Legacy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
  </head>
  <body class="theme-dark">
    <header class="navbar-global">
      <div class="container navbar-container">
        <a href="index.html" class="brand-logo">
          <img src="assets/img/logo.png" alt="Anime Legacy" />
        </a>

        <nav class="nav-links">
          <ul role="menubar">
            <li role="none">
              <a role="menuitem" href="index.html"
                ><i class="fas fa-home"></i> Home</a
              >
            </li>
            <li role="none">
              <a role="menuitem" href="archive.html"
                ><i class="fas fa-folder-open"></i> Archive</a
              >
            </li>
          </ul>
        </nav>

        <button
          class="search-trigger"
          aria-label="Open Search"
          id="btn-open-search"
        >
          <i class="fas fa-search"></i>
        </button>
      </div>
    </header>

    <div
      class="search-modal"
      id="search-modal"
      aria-hidden="true"
      role="dialog"
    >
      <div class="search-modal-backdrop" id="search-backdrop"></div>
      <div class="search-modal-content">
        <div class="search-input-wrapper">
          <i class="fas fa-search search-icon-inside"></i>
          <input
            type="text"
            id="global-search-input"
            placeholder="Search by title, character, or theme..."
            autocomplete="off"
          />
          <button
            class="close-search"
            id="btn-close-search"
            aria-label="Close Search"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="search-results-container" id="search-results"></div>
      </div>
    </div>

    <main
      class="main-layout"
      id="detail-view-container"
      style="padding: 3rem 0; display: none"
    >
      <div class="container" style="max-width: 900px">
        <div
          class="detail-header"
          style="text-align: center; margin-bottom: 3rem"
        >
          <span
            id="detail-badge"
            class="card-type-badge"
            style="
              font-size: 1rem;
              display: inline-block;
              padding: 0.4rem 1.2rem;
              border: 1px solid var(--color-accent-primary);
              border-radius: 20px;
              margin-bottom: 1rem;
            "
            >Category</span
          >
          <h1
            id="detail-title"
            class="hero-title"
            style="
              font-size: 3rem;
              margin-bottom: 0.5rem;
              text-shadow: var(--shadow-glow);
            "
          >
            Title Here
          </h1>
          <h2
            id="detail-name"
            style="
              font-size: 1.5rem;
              font-family: var(--font-secondary);
              color: var(--color-text-secondary);
              font-style: italic;
            "
          >
            Associated Anime Name
          </h2>
        </div>

        <div
          class="detail-hero-image"
          style="
            width: 100%;
            max-height: 500px;
            overflow: hidden;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
          "
        >
          <img
            id="detail-image"
            src=""
            alt="Cover"
            style="width: 100%; height: 100%; object-fit: cover"
          />
        </div>

        <div
          class="detail-meta-grid"
          id="detail-meta-grid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
          "
        ></div>

        <div
          class="detail-body"
          style="
            background: var(--color-bg-surface);
            padding: 2.5rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--color-text-primary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-soft);
            margin-bottom: 3rem;
          "
        >
          <p id="detail-description">Description goes here.</p>
        </div>

        <div
          id="detail-video-container"
          style="
            display: none;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.05);
          "
        >
          <iframe
            id="detail-video"
            width="100%"
            height="500"
            src=""
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </main>

    <div
      id="detail-error-container"
      style="display: none; text-align: center; padding: 10rem 0"
    >
      <h2 style="font-size: 2rem; color: var(--color-text-secondary)">
        Content Not Found
      </h2>
      <p style="margin-bottom: 2rem; color: var(--color-text-muted)">
        The requested item does not exist or has been removed.
      </p>
      <a
        href="archive.html"
        style="
          padding: 0.8rem 2rem;
          background: var(--color-accent-primary);
          color: white;
          border-radius: var(--radius-sm);
          font-weight: bold;
        "
        >Return to Archive</a
      >
    </div>

    <footer class="footer-global">
      <div class="container">
        <p>&copy; 2026 Anime Legacy. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="assets/js/app.js"></script>
    <script type="module" src="assets/js/pages/detail.js"></script>
  </body>
</html>
